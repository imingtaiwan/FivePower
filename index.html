<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>五力互動系統 v15</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>

<style>

body{
  font-family:sans-serif;
  padding:16px;
  background:#f5f5f5;
}

.container{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.rightPanel{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.chartBox{
  height:380px;
  background:white;
  border-radius:12px;
  border:1px solid #ddd;
  padding:12px;
}

.card{
  display:flex;
  align-items:flex-start;
  gap:12px;

  border-radius:12px;
  border:1px solid #ddd;

  padding:12px;
  margin-bottom:12px;
}

.card.gate{
  background:#fdecea;
}

.card.care{
  background:#eaf2fb;
}

.card.clear{
  background:#f3ecfb;
}

.card.action{
  background:#fff9db;
}

.card.adapt{
  background:#eafaf1;
}

.iconBox{
  width:90px;
  height:90px;

  display:flex;
  justify-content:center;
  align-items:center;

  flex-shrink:0;
}

.iconBox img{
  width:82px;
  height:82px;
  object-fit:contain;
}

.content{
  flex:1;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.titleRow{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.title{
  font-weight:bold;
  font-size:18px;
}

.sub{
  font-size:13px;
  color:#666;
}

.control-row{
  display:flex;
  gap:6px;
  margin-top:8px;
}

input{
  flex:1;
}

button{
  padding:4px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:white;
}

.panel{
  background:white;
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
}

.footer{
  margin-top:18px;
  text-align:right;
  font-size:12px;
  color:#777;
  line-height:1.6;
}

@media(max-width:768px){

  .container{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<h2>五力互動系統 v15</h2>

<button onclick="resetAll()">重置</button>

<div class="container">

  <div id="app"></div>

  <div class="rightPanel">

    <div class="chartBox">
      <canvas id="radar"></canvas>
    </div>

    <div class="panel" id="insight">

      <div style="font-weight:bold;margin-bottom:8px;">
        解讀區
      </div>

      請操作滑桿

    </div>

    <div class="footer">

      Five Power Interactive System v15<br>

      Developed by Iming Huang

      <br><br>

      Contact:<br>

      fivepower.tw@gmail.com

    </div>

  </div>

</div>

<script>

const radarLabels = [
  "釐清力",
  "照顧力",
  "調適力",
  "自發力",
  "守門力"
];

const cardData = [

  {
    label:"守門力",
    sub:"界線管理・保護自己",
    color:"#d98880",
    base:"key",
    className:"gate",
    radarIndex:4
  },

  {
    label:"照顧力",
    sub:"照顧自己・補充能量",
    color:"#7fb3d5",
    base:"water",
    className:"care",
    radarIndex:1
  },

  {
    label:"釐清力",
    sub:"客觀觀察・理解脈絡",
    color:"#bb8fce",
    base:"glasses",
    className:"clear",
    radarIndex:0
  },

  {
    label:"自發力",
    sub:"啟動能量・自在表達",
    color:"#f4d03f",
    base:"star",
    className:"action",
    radarIndex:3
  },

  {
    label:"調適力",
    sub:"調整變化・維持彈性",
    color:"#82e0aa",
    base:"bag",
    className:"adapt",
    radarIndex:2
  }

];

let state = [2,2,2,2,2];

const reflections = [

  [
    "有些事情，好像還看不清楚。",
    "客觀地評估事情的全貌。",
    "好像有點想得太多。"
  ],

  [
    "好像忘了好好照顧自己。",
    "照顧自己的同時，也沒有忘記別人。",
    "好像付出太多、忽略了自己。"
  ],

  [
    "好像在勉強自己配合。",
    "適度調整，保有舒適的狀態。",
    "好像撐太久，快爆了。"
  ],

  [
    "好像失去自己的聲音。",
    "放心自在地表達自己。",
    "好像有點太衝動了。"
  ],

  [
    "有些界線，好像消失了。",
    "保護自己，也保留與人的連結。",
    "好像設下太多界線、太多限制了。"
  ]

];


/* 主物件切換 */

function getMainImage(base,value){

  if(value === 1){
    return `${base}_low.png`;
  }

  if(value === 3){
    return `${base}_high.png`;
  }

  return `${base}_mid.png`;

}


/* 狀態映照 */

function getReflection(i,v){

  return reflections[i][v-1];

}


function showInsight(i){

  const v = state[i];

  document.getElementById("insight").innerHTML = `

    <div style="font-weight:bold;font-size:18px;margin-bottom:8px;">

      ${radarLabels[i]}

    </div>

    <div style="line-height:1.8;">
      ${getReflection(i,v)}
    </div>

  `;

}


let chart;


/* 放射線 */

const vectorPlugin = {

  id:'vectorLines',

  afterDatasetsDraw(chart){

    const {ctx, scales:{r}} = chart;

    const cx = r.xCenter;
    const cy = r.yCenter;

    chart.data.datasets[0].data.forEach((v,i)=>{

      const pt = r.getPointPositionForValue(i,v);

      ctx.beginPath();

      ctx.moveTo(cx,cy);

      ctx.lineTo(pt.x,pt.y);

      ctx.lineWidth = 4;

      ctx.strokeStyle = cardData.find(c=>c.radarIndex===i).color;

      ctx.stroke();

    });

  }

};


function render(){

  document.getElementById("app").innerHTML =

  cardData.map((c)=>`

    <div class="card ${c.className}">

      <div class="iconBox">

        <img src="${getMainImage(c.base,state[c.radarIndex])}">

      </div>

      <div class="content">

        <div class="header">

          <div class="titleRow">

            <div class="title">
              ${c.label}
            </div>

            <div class="sub">
              ${c.sub}
            </div>

          </div>

        </div>

        <div class="control-row">

          <button onclick="adjust(${c.radarIndex},-1)">
            ⬅
          </button>

          <input
            type="range"
            min="1"
            max="3"
            step="1"
            value="${state[c.radarIndex]}"
            oninput="update(${c.radarIndex},this.value);showInsight(${c.radarIndex})"
          >

          <button onclick="adjust(${c.radarIndex},1)">
            ➡
          </button>

        </div>

      </div>

    </div>

  `).join("");

  draw();

}


function update(i,v){

  state[i] = Number(v);

  render();

}


function adjust(i,d){

  state[i] = Math.max(1,Math.min(3,state[i] + d));

  render();

  showInsight(i);

}


function resetAll(){

  state = [2,2,2,2,2];

  render();

  document.getElementById("insight").innerHTML = `

    <div style="font-weight:bold;margin-bottom:8px;">
      解讀區
    </div>

    請操作滑桿

  `;

}


function draw(){

  if(chart) chart.destroy();

  chart = new Chart(document.getElementById("radar"),{

    type:'radar',

    data:{

      labels:radarLabels,

      datasets:[{

        data:state,

        showLine:false,

        fill:false,

        pointBackgroundColor:[
          "#bb8fce",
          "#7fb3d5",
          "#82e0aa",
          "#f4d03f",
          "#d98880"
        ],

        pointRadius:7

      }]

    },

    options:{

      responsive:true,

      maintainAspectRatio:false,

      plugins:{

        legend:{
          display:false
        }

      },

      scales:{
        r:{

          min:1,
          max:3,

          ticks:{
            display:false,
            stepSize:1
          },

          grid:{
            circular:false
          },

          angleLines:{
            color:"rgba(0,0,0,0.18)",
            lineWidth:2
          },

          pointLabels:{
            font:{
              size:14
            }
          }

        }
      }

    },

    plugins:[vectorPlugin]

  });

}

render();

</script>

</body>
</html>
```
